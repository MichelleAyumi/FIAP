global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: hospital
    metrics_path: /actuator/prometheus
    basic_auth:
      username: monitor
      password: monitor1234
    static_configs:
      - targets: [scheduling-service:8080, notification-service:8081]
