server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driverClassName: org.h2.Driver
    jpa:
      database: h2
      database-plataform: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      expourse:
        include: health, info, shutdown
      endpoints:
        shutdown:
          enabled:true
      logging:
        level:
          root: INFO
          org.example: INFO
          org.springframework: INFO